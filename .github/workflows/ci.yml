name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  # The ABI lock's arithmetic decides whether the weekly canary cries wolf or stays silent through
  # a real break, and only the scheduled canary ever exercises it — so gate it here, on PRs, where
  # the edits actually land. Stubs out libclang, so no toolchain is needed and it runs in seconds.
  abi-lock:
    name: ABI lock semantics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python bindgen/extract/test_abi_lock.py
      # Constant folding is clang's own, so this one needs a real libclang: the bindings come from
      # the wheel, and configure_libclang() picks up the runner image's LLVM as it would locally.
      - run: pip install libclang==18.1.1 && python bindgen/extract/test_const_eval.py

  smoke:
    name: smoke (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-latest }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm }
          - { platform: windows-x86_64, runner: windows-latest }
          - { platform: macos-aarch64, runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v7

      # Runs Gradle and satisfies the JDK 25 toolchain the build requests (DESIGN.md §10);
      # the foojay resolver would auto-provision it otherwise.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Download pinned Slang natives (verified against committed manifest)
        run: ./gradlew :natives:downloadNatives --console=plain

      - name: Smoke test — C export path vs COM vtable path must agree
        run: >
          ./gradlew :slang:test
          "-PslangNativesDir=natives/build/payload/${{ matrix.platform }}/lib"
          --console=plain
