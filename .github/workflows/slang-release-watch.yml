name: Slang release watch

# Closes the one gap the ABI canary never covered. The canary answers "did upstream break the
# append-only contract?" against `master`, and it is silent when the answer is no — which is
# almost always. Nothing answered "has upstream shipped a release we are behind?", so the pin sat
# three releases stale (2026.13.1, 2026.14, 2026.14.1) and that only surfaced by reading a canary
# report by hand.
#
# This watches releases and keeps ONE open tracking issue while the pin is behind. Upstream ships
# most weeks, so the issue cannot be keyed on the latest release — that filed a fresh one every
# Monday for the same stale pin. Instead, the open issue this watch filed is retitled to the newest
# release as upstream moves on (an edit, so nobody is notified again), and a bump branch for the
# latest release keeps the run quiet altogether.
#
# Dispatching it with mode=bump also runs the regeneration (.github/workflows/slang-bump.yml),
# which ends with a green branch ready to review. That is off by default on the schedule for one
# specific reason, recorded here so the next person does not "fix" it: a called workflow's
# GITHUB_TOKEN permissions can only be maintained or reduced through the chain, never elevated,
# and slang-bump's push job needs contents: write. The `bump` job below grants it, but that chain
# cannot be exercised until it runs for real. Prove it once by hand with mode=bump; if it works,
# flipping the schedule to bump is a one-line change to the `if:` below.
on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC, an hour after the ABI canary
  workflow_dispatch:
    inputs:
      mode:
        description: "issue = file a tracking issue only; bump = also regenerate"
        type: choice
        options: [issue, bump]
        default: issue

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: slang-release-watch
  cancel-in-progress: false

jobs:
  check:
    name: check for a newer Slang release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      behind: ${{ steps.compare.outputs.behind }}
      pinned: ${{ steps.compare.outputs.pinned }}
      latest: ${{ steps.compare.outputs.latest }}
      tag: ${{ steps.compare.outputs.tag }}
      branch: ${{ steps.compare.outputs.branch }}
      tracked: ${{ steps.compare.outputs.tracked }}
      issue: ${{ steps.compare.outputs.issue }}
      title: ${{ steps.compare.outputs.title }}
    steps:
      - uses: actions/checkout@v7

      - name: Compare the pinned release against the latest upstream
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # natives/build.gradle.kts is the pin of record for which binaries ship. (The library's
          # own PINNED_SLANG_VERSION is a floor that moves with the bindings, not with the
          # natives, so it is the wrong thing to compare against here.)
          pinned=$(sed -n 's/^val slangVersion = "\(.*\)"$/\1/p' natives/build.gradle.kts)
          [ -n "$pinned" ] || { echo "::error::could not read slangVersion from natives/build.gradle.kts"; exit 1; }

          tag=$(gh api repos/shader-slang/slang/releases/latest --jq .tag_name)
          latest="${tag#v}"
          branch="bump/slang-$latest"

          echo "pinned=$pinned"  >> "$GITHUB_OUTPUT"
          echo "latest=$latest"  >> "$GITHUB_OUTPUT"
          echo "tag=$tag"        >> "$GITHUB_OUTPUT"
          echo "branch=$branch"  >> "$GITHUB_OUTPUT"

          if [ "$pinned" = "$latest" ]; then
            echo "behind=false" >> "$GITHUB_OUTPUT"
            echo "tracked=none" >> "$GITHUB_OUTPUT"
            echo "pinned to $pinned, which is the latest release — nothing to do"
            echo "## Slang $pinned is current" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "behind=true" >> "$GITHUB_OUTPUT"
          echo "pinned $pinned, upstream latest $latest"

          title="Bump Slang $pinned → $latest"
          echo "title=$title" >> "$GITHUB_OUTPUT"

          # Already in flight? A bump branch means a human has the work. Otherwise find the issue an
          # earlier run filed — any open one, whichever release it named then, since matching on
          # the latest release is what used to file a new issue every week upstream shipped.
          open=$(gh issue list --state open --limit 100 --json number,title,author --jq \
            '[.[] | select(.author.is_bot and (.title | startswith("Bump Slang ")))] | first // empty | "\(.number)\t\(.title)"')
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
            echo "tracked=branch" >> "$GITHUB_OUTPUT"
          elif [ -z "$open" ]; then
            echo "tracked=none" >> "$GITHUB_OUTPUT"
          else
            echo "issue=${open%%$'\t'*}" >> "$GITHUB_OUTPUT"
            if [ "${open#*$'\t'}" = "$title" ]; then
              echo "tracked=issue" >> "$GITHUB_OUTPUT"
            else
              echo "tracked=stale-issue" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Summarise
        if: steps.compare.outputs.behind == 'true'
        env:
          PINNED: ${{ steps.compare.outputs.pinned }}
          LATEST: ${{ steps.compare.outputs.latest }}
          TRACKED: ${{ steps.compare.outputs.tracked }}
          BRANCH: ${{ steps.compare.outputs.branch }}
          ISSUE: ${{ steps.compare.outputs.issue }}
        run: |
          {
            echo "## Slang $LATEST is available (pinned: $PINNED)"
            echo
            case "$TRACKED" in
              branch)      echo "Already regenerated — \`$BRANCH\` is waiting for a PR." ;;
              issue)       echo "Already tracked by #$ISSUE." ;;
              stale-issue) echo "Retitling #$ISSUE to Slang $LATEST." ;;
              none)        echo "Filing a tracking issue." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

  # Files the tracking issue, or brings the open one up to the latest release, so a stale pin has
  # exactly one issue rather than one per release.
  track-issue:
    name: file or retitle the tracking issue
    needs: check
    if: needs.check.outputs.behind == 'true' && (needs.check.outputs.tracked == 'none' || needs.check.outputs.tracked == 'stale-issue')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Open it, or retitle the open one
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PINNED: ${{ needs.check.outputs.pinned }}
          LATEST: ${{ needs.check.outputs.latest }}
          TAG: ${{ needs.check.outputs.tag }}
          TITLE: ${{ needs.check.outputs.title }}
          ISSUE: ${{ needs.check.outputs.issue }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/issue.md" <<EOF
          Upstream has released [\`$TAG\`](https://github.com/shader-slang/slang/releases/tag/$TAG);
          \`natives/build.gradle.kts\` still pins \`$PINNED\`.

          Run the **Slang version bump** workflow with \`slang_release: $TAG\`:

          https://github.com/$REPO/actions/workflows/slang-bump.yml

          It re-pins the natives, re-records all six manifests, regenerates the ABI model, lock and
          Java on macOS across all six triples, tests every platform CI covers, and pushes
          \`bump/slang-$LATEST\` only once those are green — then you open the PR.

          Nothing is urgent here. Slang's public ABI is append-only, so being behind a release does
          not break anything; it only means the newest options are not exposed yet. If the bump
          run fails the ABI lock instead, that IS urgent — it means upstream broke the contract,
          the run reports exactly which facts moved, and the bump has to be done by hand (see
          CLAUDE.md).

          _Filed by \`.github/workflows/slang-release-watch.yml\`, which retitles this issue as
          newer releases ship rather than filing another._
          EOF

          # This job has no checkout — gh cannot infer the repo from git, so name it explicitly.
          if [ -n "$ISSUE" ]; then
            gh issue edit "$ISSUE" --repo "$REPO" --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md"
          fi

  # Off on the schedule until the permission chain has been proven by a real run — see the header.
  bump:
    name: regenerate
    needs: check
    if: needs.check.outputs.behind == 'true' && needs.check.outputs.tracked != 'branch' && inputs.mode == 'bump'
    permissions:
      contents: write
    uses: ./.github/workflows/slang-bump.yml
    with:
      slang_release: ${{ needs.check.outputs.tag }}
